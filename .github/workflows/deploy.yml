# =============================================================================
# GitHub Actions Workflow - Deploy to VPS
# MC Pro Website
#
# Deploy runs on a self-hosted action-runner located on the VPS itself
# (labels: self-hosted, mcpro-web). No SSH/rsync needed — the runner
# checks out the code and drives docker compose locally.
#
# Runner requirements:
#   - labels: mcpro-web (self-hosted is applied automatically)
#   - user in the "docker" group
#   - rsync, curl, docker compose v2 installed
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  VPS_HOST: ${{ secrets.VPS_HOST }}

jobs:
  # -------------------------------------------------------------------------
  # Build & Test Job (GitHub-hosted)
  # -------------------------------------------------------------------------
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Security Scan Job (GitHub-hosted)
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Deploy Job — runs ON the VPS via self-hosted runner
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, mcpro-web]
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check notification prerequisites
        id: precheck
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "can_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy locally on VPS
        env:
          APP_DIR: ${{ github.workspace }}
        run: |
          set -e
          DEPLOY_DIR="$HOME/mc-pro-web"
          BACKUP_DIR="$HOME/backups/$(date +%Y%m%d_%H%M%S)"

          echo "Deploying from runner workspace to ${DEPLOY_DIR}..."

          # Backup existing deploy (if any)
          if [ -d "${DEPLOY_DIR}" ] && [ -n "$(ls -A "${DEPLOY_DIR}" 2>/dev/null)" ]; then
            mkdir -p "$HOME/backups"
            cp -a "${DEPLOY_DIR}/." "${BACKUP_DIR}/" || true
            echo "Backup saved to ${BACKUP_DIR}"
          fi

          # Sync sources into the app dir (preserve local .env)
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='*.log' \
            "${APP_DIR}/" "${DEPLOY_DIR}/"

          cd "${DEPLOY_DIR}"

          echo "Building and starting containers..."
          docker compose down
          docker compose up -d --build

          echo "Waiting for containers to be healthy..."
          sleep 10

          echo "Checking health endpoints..."
          if curl -f http://localhost:8181/healthz && curl -f http://localhost:8181/api/healthz; then
            echo "Deployment successful!"
          else
            echo "Health check failed!"
            docker compose logs --tail=50
            exit 1
          fi

          echo "Cleaning up old Docker images..."
          docker system prune -f

      - name: Notify on failure
        if: failure() && steps.precheck.outputs.can_notify == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Deployment failed for MC Pro Website",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Smoke Test Job (GitHub-hosted — verifies from outside the VPS)
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."

          # Test main page
          curl -f -o /dev/null -s -w "Main page: %{http_code}\n" https://mcprogc.com/

          # Test health endpoint
          curl -f -s https://mcprogc.com/healthz

          # Test static assets
          curl -f -o /dev/null -s -w "CSS: %{http_code}\n" https://mcprogc.com/assets/index.css || true

          # Test contact API health (proxied through nginx)
          curl -f -s https://mcprogc.com/api/healthz

          echo "Smoke tests completed!"
