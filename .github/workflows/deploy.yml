# =============================================================================
# GitHub Actions Workflow - Deploy to VPS
# Summit Commercial Construction Website
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}

jobs:
  # -------------------------------------------------------------------------
  # Build & Test Job
  # -------------------------------------------------------------------------
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build application
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Security Scan Job
  # -------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Deploy Job
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    outputs:
      can_deploy: ${{ steps.precheck.outputs.can_deploy }}
      can_notify: ${{ steps.precheck.outputs.can_notify }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy prerequisites
        id: precheck
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping VPS deploy: required secrets are missing."
          fi

          # Optional; defaults to 22 when unset
          if [ -n "${{ secrets.VPS_SSH_PORT }}" ]; then
            echo "ssh_port=${{ secrets.VPS_SSH_PORT }}" >> "$GITHUB_OUTPUT"
          else
            echo "ssh_port=22" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "can_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_notify=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Setup SSH
        if: steps.precheck.outputs.can_deploy == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      
      - name: Add VPS to known hosts
        if: steps.precheck.outputs.can_deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ steps.precheck.outputs.ssh_port }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to VPS
        if: steps.precheck.outputs.can_deploy == 'true'
        env:
          SSH_PORT: ${{ steps.precheck.outputs.ssh_port }}
        run: |
          echo "Starting deployment to ${{ secrets.VPS_HOST }}:${SSH_PORT}..."

          APP_DIR="/home/${{ secrets.VPS_USER }}/mc-pro-website"
          BACKUP_DIR="/home/${{ secrets.VPS_USER }}/backups/$(date +%Y%m%d_%H%M%S)"

          # Ensure remote app directory exists before rsync
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${APP_DIR}' '${BACKUP_DIR}'"

          # Backup existing deploy (if any), then sync sources
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "if [ -d '${APP_DIR}' ] && [ \"\$(ls -A '${APP_DIR}' 2>/dev/null)\" ]; then mkdir -p '${BACKUP_DIR}' && cp -a '${APP_DIR}/.' '${BACKUP_DIR}/' || true; fi"

          rsync -avz --delete \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=yes" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='*.log' \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/"

          # Build and start containers on VPS
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << DEPLOY
            set -e
            cd "${APP_DIR}"

            echo "Building and starting containers..."
            docker compose down
            docker compose up -d --build

            echo "Waiting for container to be healthy..."
            sleep 10

            echo "Checking health endpoint..."
            if curl -f http://localhost:8080/healthz; then
              echo "Deployment successful!"
            else
              echo "Health check failed!"
              docker compose logs --tail=50
              exit 1
            fi

            echo "Cleaning up old Docker images..."
            docker system prune -f
          DEPLOY
      
      - name: Verify deployment
        if: steps.precheck.outputs.can_deploy == 'true'
        run: |
          echo "Verifying deployment..."
          sleep 5
          curl -f http://${{ secrets.VPS_HOST }}:8080/healthz || exit 1
          echo "Deployment verified successfully!"
      
      - name: Notify on failure
        if: failure() && steps.precheck.outputs.can_notify == 'true'
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Deployment failed for Summit Commercial Website",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Smoke Test Job
  # -------------------------------------------------------------------------
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.can_deploy == 'true'
    
    steps:
      - name: Wait for deployment
        run: sleep 30
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test main page
          curl -f -o /dev/null -s -w "Main page: %{http_code}\n" http://${{ secrets.VPS_HOST }}:8080/
          
          # Test health endpoint
          curl -f -s http://${{ secrets.VPS_HOST }}:8080/healthz
          
          # Test static assets
          curl -f -o /dev/null -s -w "CSS: %{http_code}\n" http://${{ secrets.VPS_HOST }}:8080/assets/index.css || true
          
          echo "Smoke tests completed!"
