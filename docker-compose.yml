# =============================================================================
# Docker Compose - MC Pro website (behind existing Traefik on VPS)
# =============================================================================
#
# Requires an external Traefik network (default name: traefik).
# Set the public hostname Traefik should match, e.g.:
#   export TRAEFIK_HOST=mcpro.twojadomena.pl
#   docker compose up -d --build
#
# Cloudflare Tunnel / DNS should target Traefik (usually http://127.0.0.1:80),
# NOT this container's :8080. Traefik routes by Host → this service.
# =============================================================================

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mc-pro-website
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service_name,environment"

    # Traefik discovers the container on this shared network
    networks:
      - mc-pro-network
      - traefik

    # Only expose inside Docker — Traefik reaches :8080 on the container network.
    # Host publish kept for local/CI health checks on the VPS (curl localhost:8080).
    expose:
      - "8080"
    ports:
      - "8080:8080"

    labels:
      - "traefik.enable=true"
      # Public hostname (must match Cloudflare subdomain Host header)
      - "traefik.http.routers.mc-pro.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.mc-pro.entrypoints=web"
      # If your Traefik also has TLS / websecure, uncomment:
      # - "traefik.http.routers.mc-pro-secure.rule=Host(`${TRAEFIK_HOST}`)"
      # - "traefik.http.routers.mc-pro-secure.entrypoints=websecure"
      # - "traefik.http.routers.mc-pro-secure.tls=true"
      # - "traefik.http.routers.mc-pro-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.mc-pro.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mc-pro-network:
    driver: bridge
  traefik:
    external: true
